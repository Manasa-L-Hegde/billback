services:
  - type: web
    name: billback
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: META_API_KEY
        sync: false
